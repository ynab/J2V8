name: Build and test J2V8

on: [push]

jobs:
  build_j2v8_android:
    name: Build J2V8 for Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

    - name: Set up JDK 17
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      with:
        distribution: temurin
        java-version: 17

    - name: Point ANDROID_NDK_HOME at the runner's NDK
      run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

    - name: Build native libraries and release .aar
      run: ./rebuild_native.sh

    - name: Archive J2V8 Android aar
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: j2v8-android-aar
        path: build/outputs/aar/j2v8-release.aar
